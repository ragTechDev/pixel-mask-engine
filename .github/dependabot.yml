version: 2

updates:
  # GitHub Actions: keeps the commit-SHA pins in .github/workflows current.
  # Dependabot rewrites the SHA and the "# vN" comment together.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    # Matches minimumReleaseAge in pnpm-workspace.yaml: never propose a
    # version younger than 3 days.
    cooldown:
      default-days: 3
    groups:
      actions:
        patterns: ["*"]

  # Dev dependencies (the published package has no runtime dependencies).
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 3
    open-pull-requests-limit: 5
    ignore:
      # tsup will not support TypeScript 7 (egoist/tsup#1405). Skip TS 7+ and
      # new tsup majors until the move to tsdown. Tracked in issue #6, which
      # also says when to remove these rules.
      - dependency-name: typescript
        versions: [">=7"]
      - dependency-name: tsup
        update-types: ["version-update:semver-major"]
    groups:
      minor-and-patch:
        update-types: ["minor", "patch"]
